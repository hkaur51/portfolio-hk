<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="Dr. Harsimrat Kaur, MSPH, BDS: dentist, public health researcher and health tech builder.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Harsimrat Kaur, MSPH, BDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=Permanent+Marker&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* VOICE: personal, tactile, editorial — a designer's scrapbook, not an app.
   IDEA: everything is paper: grainy off-white sheets, masking tape, film strips, marker lettering.
   PICTURE: the corkboard photo, as big as the screen allows.
   COLOUR and TYPE: #efeee8 paper, #282828 ink, rust #ba3f1e, orange #cd711c, olive #5f6b2d; Permanent Marker caps for headings, Inter Tight (Helvetica-like) for reading, Reenie Beanie for handwriting.
   LAYOUT: thin header, board fills the first screen, project pages are one torn paper sheet. */
:root{color-scheme:light;
  --bg:#ffffff;--ink:light-dark(#282828,#efeee8);--soft:light-dark(#5c5a55,#b4b0a7);
  --paper:#ffffff;--line:light-dark(#d6d3c8,#3d3b37);--accent:light-dark(#ba3f1e,#e8805c);
  --orange:#cd711c;--olive:light-dark(#5f6b2d,#a3b062);
  --tape:light-dark(rgba(226,214,186,.88),rgba(190,178,150,.7));--panel:light-dark(#f7f6f1,#282725)}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.index{padding:0 16px 24px}
html{scroll-padding-top:72px}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 "Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:clip}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px;padding:14px max(4vw,16px) 8px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;text-decoration:none;color:var(--ink)}
.brand b{font:400 32px/1 "Permanent Marker",cursive;text-transform:uppercase;letter-spacing:.5px}
.brand span{color:var(--soft);font-size:15px}
.doodle{width:34px;height:34px;flex:none;color:var(--olive)}
.nav{display:flex;gap:2px}
.nav a{font:400 18px/1 "Permanent Marker",cursive;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:12px 12px;border-radius:6px}
.nav a[aria-current=page]{color:var(--accent)}
.view[hidden]{display:none}
/* board */
.boardwrap{padding:0;display:grid;justify-items:center}
.stage{position:relative;width:min(100%,calc(100svh * 1472 / 1840));aspect-ratio:1472/1840;margin:0 auto}
.stage>img.wide{display:none}
.stage{container-type:inline-size}
.social{position:absolute;left:1.63%;top:92.9%;max-width:45%;z-index:25;display:flex;flex-wrap:wrap;gap:0 2.4cqw;font:800 3cqw/1 "Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.02em;text-transform:uppercase}
.social a{color:#102ce9;text-decoration:none;padding:.15em 0;overflow-wrap:anywhere;display:inline-flex;align-items:center;gap:.25em}
.social a:hover{text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.15em}
.social a.mail{text-transform:none}
.social a.todo{opacity:.35}
.social a.onphoto{color:#fff}

@media (min-width:700px) and (min-aspect-ratio:1/1){.social{left:2.92%;top:90.6%;max-width:none;font-size:1.75cqw;gap:0 2cqw}.social a{padding:.35em 0}.stage{width:min(100%,calc(100svh * 2400 / 1350));aspect-ratio:2400/1350}.stage>img.wide{display:block}.stage>img.tall{display:none}}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.overlay{position:absolute;inset:0}
.spot{position:absolute;display:block;transform:rotate(var(--r,0deg));transition:transform .16s ease,box-shadow .16s ease;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.spot.filled{background:#fff;padding:clamp(3px,.5vw,9px);box-sizing:border-box;box-shadow:0 2px 6px #21190f55,0 0 1px #21190f55}
.spot.filled.framed{padding:5% 5% 16%;background:#f7f6f1}
.spot img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
a.spot:hover,a.spot:focus-visible{z-index:20;transform:translateY(-3px) rotate(var(--r,0deg));box-shadow:0 10px 18px #17120d66}
a.spot:not(.filled):hover,a.spot:not(.filled):focus-visible{box-shadow:0 0 0 2px #fff8,0 10px 18px #17120d55}
.tip{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) rotate(calc(-1 * var(--r,0deg)));z-index:30;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding:2px 12px 0;background:#f7f6f1;color:#282828;box-shadow:0 2px 7px #0003;font:400 24px/1.3 "Reenie Beanie",cursive;pointer-events:none}
a.spot:hover .tip,a.spot:focus-visible .tip{display:block}
@media (max-width:700px){a.spot::after{content:"";position:absolute;inset:-6px}}
body.editing .spot{border:1px dashed #0f6a97;background-color:#168ac022;cursor:move;touch-action:none}
body.editing .spot::before{content:attr(data-n);position:absolute;top:-16px;left:-2px;padding:0 4px;border-radius:3px;background:#282828;color:#efeee8;font:11px/1.5 "Inter Tight",sans-serif}
body.editing .spot.sel{border:2px solid var(--orange);z-index:50}
.grip{display:none;position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:var(--orange);cursor:nwse-resize;touch-action:none}
body.editing .grip{display:block}
.index{width:min(100%,640px);margin:18px auto 0;display:none}
.index h2{font:400 24px/1.1 "Permanent Marker",cursive;text-transform:uppercase;margin:0 0 10px}
.index ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.index a{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
.index img{width:44px;height:44px;object-fit:cover}
@media (max-width:700px){.index.has{display:block}}
/* paper pages */
.page{max-width:880px;margin:24px auto 72px;padding:0 max(4vw,16px)}
.back{display:inline-flex;align-items:center;min-height:44px;font:400 16px/1 "Permanent Marker",cursive;text-transform:uppercase;color:var(--ink);text-decoration:none}
.sheet{position:relative;background:var(--paper);padding:clamp(26px,5vw,56px) clamp(22px,5vw,56px) clamp(40px,6vw,72px);margin-top:14px;filter:drop-shadow(0 8px 18px #0000001f);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),97% 100%,93% calc(100% - 7px),88% calc(100% - 2px),82% calc(100% - 9px),76% calc(100% - 3px),70% calc(100% - 8px),63% 100%,57% calc(100% - 6px),50% calc(100% - 1px),44% calc(100% - 8px),37% calc(100% - 3px),31% calc(100% - 9px),24% calc(100% - 2px),18% calc(100% - 7px),11% 100%,5% calc(100% - 6px),0 calc(100% - 2px))}
.tape{position:relative;height:0}
.tape::before,.tape::after{content:"";position:absolute;top:2px;z-index:2;width:110px;height:30px;background:var(--tape);transform:rotate(-4deg);box-shadow:0 1px 2px #0001}
.tape::before{left:7%}.tape::after{right:7%;transform:rotate(5deg)}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-bottom:26px;background:var(--line)}
.ptitle{font:400 clamp(34px,5.5vw,50px)/1.05 "Permanent Marker",cursive;text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.5px}
.psub{font:400 26px/1.25 "Reenie Beanie",cursive;color:var(--accent);margin:8px 0 0}
.pbody{margin-top:22px;max-width:66ch;font-size:17px}
.pbody p{margin:0 0 14px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;background:#282828;color:#efeee8;text-decoration:none;font-weight:700;letter-spacing:.2px}
.links a:hover{background:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 0;margin-top:30px;padding:24px 6px;background-color:#1c1a17;background-image:radial-gradient(circle,#efeee8 0 3px,transparent 3.5px),radial-gradient(circle,#efeee8 0 3px,transparent 3.5px);background-size:22px 12px,22px 12px;background-position:0 5px,0 calc(100% - 5px);background-repeat:repeat-x}
.gallery figure{margin:0 5px;position:relative}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:sepia(.12) contrast(1.04)}
.empty{color:var(--soft);font:400 30px/1.2 "Reenie Beanie",cursive;margin:18px 0 0}
.aboutgrid{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:32px;align-items:start}
.aboutgrid .ph{background:#f7f6f1;padding:10px 10px 34px;box-shadow:0 3px 10px #0002;transform:rotate(-2deg)}
.aboutgrid .ph img,.aboutgrid .ph div{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--line);filter:grayscale(1) contrast(1.08)}
.contact{margin-top:18px;display:grid;gap:6px}
@media (max-width:600px){.aboutgrid{grid-template-columns:1fr}.aboutgrid .ph{max-width:220px}}
/* editing UI */
.field{display:grid;gap:4px;margin:12px 0}
.field>span{font-weight:700;font-size:14px}
.field input[type=text],.field input[type=url],.field input[type=email],.field select,.field textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:2px;background:light-dark(#fff,#1d1c1a);font-size:16px}
.field textarea{min-height:180px;resize:vertical;line-height:1.5}
.btn{min-height:44px;padding:9px 16px;border-radius:2px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;font-weight:700}
.btn.primary{background:#282828;border-color:#282828;color:#efeee8}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools{position:fixed;left:14px;bottom:14px;z-index:100;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100vw - 28px)}
.tools .btn{box-shadow:0 3px 12px #0003}
.status{font-size:14px;color:var(--soft);padding:10px 12px;background:var(--paper);box-shadow:0 3px 12px #0002}
.status:empty{display:none}
.panel{position:fixed;right:14px;top:14px;z-index:120;width:min(340px,calc(100vw - 28px));max-height:calc(100svh - 28px);overflow:auto;padding:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 36px #0004}
.panel h2{margin:0;font:400 22px/1.1 "Permanent Marker",cursive;text-transform:uppercase}
.hint{color:var(--soft);font-size:14px;margin:10px 0 0}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:6px;margin-bottom:6px}
.linkrow input{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:light-dark(#fff,#1d1c1a);font-size:16px}
.gallery .rm{position:absolute;right:4px;bottom:4px;min-height:28px;padding:0 8px;font-size:13px}
.note{max-width:880px;margin:0 auto 10px;padding:0 max(4vw,16px);color:var(--soft);font-size:14px}
.note:empty{display:none}
@media (prefers-reduced-motion:reduce){.spot{transition:none}}

/* colour combos: landing = French Blue on Lemon Chiffon; pages rotate through the three poster pairs */
:root{--bg:#FFFACD;--strong:#0055A4;--on:#FFFACD;--ink:#1f2f4f;--soft:#45577a;--accent:#CD5C5C;--line:#ece4b2;--paper:#FFFACD}
body{background:var(--bg);transition:background-color .3s}
body[data-combo=red]{--bg:#FFFACD;--strong:#CD5C5C;--on:#FFFACD;--ink:#7a2c2c;--soft:#94403d;--accent:#CD5C5C;--line:#eedcb0;--paper:#FFFACD}
body[data-combo=blue]{--bg:#DCF4A2;--strong:#0055A4;--on:#DCF4A2;--ink:#003b73;--soft:#1d4f84;--accent:#0055A4;--line:#bcd884;--paper:#DCF4A2}
body[data-combo=ucla]{--bg:#DBDABE;--strong:#536895;--on:#DBDABE;--ink:#34436a;--soft:#46577e;--accent:#536895;--line:#c2c0a0;--paper:#DBDABE}
a{color:var(--strong)}
.sheet{background:transparent;filter:none;clip-path:none;padding:0;margin-top:4px}
.tape{display:none}
.hero{margin:0 calc(50% - 50vw) 34px;padding:clamp(44px,8vw,110px) max(5vw,16px);background:var(--strong);color:var(--on)}
.hero>div{max-width:880px;margin:0 auto;padding-inline:max(4vw,16px)}
.hero{padding-inline:0}
.hero .ptitle{color:var(--on)}.hero .psub{color:var(--on);opacity:.92}
.back{color:var(--strong)}
.pbody,.contact{color:var(--ink)}
.links a{background:var(--strong);color:var(--on)}.links a:hover{background:var(--ink)}
.gallery{background-color:var(--strong);background-image:radial-gradient(circle,var(--bg) 0 3px,transparent 3.5px),radial-gradient(circle,var(--bg) 0 3px,transparent 3.5px)}
.social a{color:#0055A4}.social a:hover{color:#CD5C5C}
.aboutgrid .ph{background:#fff}
.btn.primary{background:var(--strong);border-color:var(--strong);color:var(--on)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.field input[type=text],.field input[type=url],.field input[type=email],.field select,.field textarea,.linkrow input{background:#fffef5}

.stage{overflow:hidden}
.stage>img.tall,.stage>img.wide{position:absolute;inset:0;width:100%;height:100%}
.stage>.me{position:absolute;left:46.171%;top:58.773%;width:57.259%;height:41.227%;pointer-events:none}
.stage>.me img{width:100%;height:100%;display:block}
.social{top:66.2%;max-width:62%}
@media (min-width:700px) and (min-aspect-ratio:1/1){.stage>.me{left:57.693%;top:30.476%;width:43.452%;height:69.524%}.social{top:90.6%;max-width:none}}

/* inside pages: Coconat titles, Fraunces text and italics, Cinzel small capitals */
@font-face{font-family:Coconat;src:url(fonts/coconat-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Coconat;src:url(fonts/coconat-demi.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Coconat;src:url(fonts/coconat-bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:Fraunces;src:url(fonts/fraunces-italic.woff2) format("woff2");font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:Cinzel;src:url(fonts/cinzel.woff2) format("woff2");font-weight:400 900;font-display:swap}
.page{font:400 18px/1.65 Fraunces,Georgia,serif;font-optical-sizing:auto}
.page .ptitle{font:400 clamp(44px,7vw,84px)/1 Coconat,Georgia,serif;text-transform:none;letter-spacing:-.01em}
.page .psub{font:italic 300 clamp(21px,2.6vw,28px)/1.3 Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1;margin-top:14px}
.page .pbody{font:400 18px/1.7 Fraunces,Georgia,serif;font-variation-settings:"SOFT" 50}
.page .pbody p:first-child::first-line{font-style:italic}
.page .empty{font:italic 300 26px/1.35 Fraunces,Georgia,serif}
.page .back,.page .links a,.page .contact{font-family:Cinzel,Georgia,serif;font-weight:600;letter-spacing:.08em}
.page .back{font-size:15px;text-transform:uppercase}
.page .links a{font-size:15px;text-transform:uppercase}
.page .contact{font-size:16px}
.page .contact a{text-transform:none;letter-spacing:.02em}
.page .contact a[href^="mailto:"]{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:0}
.page .field,.page .linkrow,.page .btn,.page .hint{font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif}

/* hover labels: below the card (above it near the bottom), kept inside the screen, easy to read */
.tip{top:calc(100% + 10px);bottom:auto;width:max-content;max-width:min(280px,60vw);white-space:normal;overflow:visible;text-overflow:clip;
  padding:7px 12px;border-radius:4px;background:#0055A4;color:#FFFACD;box-shadow:0 4px 14px #0055a440;
  font:600 15px/1.3 "Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:0}
.tip.up{top:auto;bottom:calc(100% + 10px)}
.tip.l{left:0;transform:rotate(calc(-1 * var(--r,0deg)))}
.tip.r{left:auto;right:0;transform:rotate(calc(-1 * var(--r,0deg)))}

/* cover: shown whole (posters, figures), never cropped; click opens full size */
.page .cover{aspect-ratio:auto;height:auto;max-height:none;object-fit:contain;background:none;box-shadow:0 6px 24px #0000001f;margin:0}
.coverlink{display:block;margin:0 0 30px;cursor:zoom-in}
.coverlink:focus-visible{outline-offset:6px}
.hero.slim{padding-block:clamp(28px,4vw,52px);margin-bottom:26px}
.hero.slim .ptitle{font-size:clamp(38px,5vw,60px)}
.psec{margin-top:clamp(48px,7vw,84px);padding-top:clamp(28px,4vw,44px);border-top:2px solid var(--strong)}
.psec-h{font:400 clamp(30px,4.4vw,48px)/1.05 Coconat,Georgia,serif;color:var(--strong);margin:0;text-wrap:balance}
.psec-sub{font:italic 300 clamp(18px,2vw,22px)/1.35 Fraunces,Georgia,serif;color:var(--soft);margin:10px 0 24px}
.secedit{border:1px solid var(--line);border-radius:6px;padding:4px 16px 16px;margin:0 0 14px}
.secedit legend{font-weight:700;padding:0 6px}
.embed{position:relative;margin:26px 0 8px;overflow:hidden;border-radius:4px;box-shadow:0 8px 28px #0000001f;background:#e9e1d4}
.embed iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block}
.cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px;margin:0 0 28px;padding:clamp(20px,3vw,30px) clamp(20px,3vw,34px);border:2px solid var(--strong);border-radius:10px;background:#fffef6;box-shadow:6px 6px 0 var(--strong)}
.cta>div{flex:1 1 320px}
.cta-h{margin:0;font:400 clamp(28px,3.6vw,40px)/1.05 Coconat,Georgia,serif;color:var(--strong)}
.cta-t{margin:8px 0 0;font:400 17px/1.5 Fraunces,Georgia,serif;color:var(--ink);max-width:52ch}
.cta-b{flex:none;display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:999px;background:var(--strong);color:var(--on);text-decoration:none;font:600 15px/1 Cinzel,Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
.cta-b:hover{background:var(--ink)}
/* gallery page */
.gintro{margin-bottom:26px}
.gpin{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start;margin:0 calc(50% - min(50vw, 640px));padding:0 max(4vw,16px)}
@media (max-width:820px){.gpin{grid-template-columns:1fr;margin:0}}
.gview{position:relative;border-radius:18px;overflow:hidden;background:#1a1a1a;box-shadow:0 10px 30px #00000026;aspect-ratio:4/5;max-height:80svh;width:100%;justify-self:center}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;height:100%}
.gtrack::-webkit-scrollbar{display:none}
.gslide{flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;display:grid;place-items:center;background:#1a1a1a}
.gmedia{width:100%;height:100%;object-fit:contain;display:block}
.gph{display:grid;place-items:center;color:#bbb;font:14px "Inter Tight",sans-serif}
.garrow,.gfull{position:absolute;width:48px;height:48px;border:0;border-radius:50%;background:#1a1a1acc;color:#fff;font:600 20px/1 "Inter Tight",sans-serif;cursor:pointer;box-shadow:0 2px 10px #0004}
.garrow:hover,.gfull:hover{background:#1a1a1a}
.garrow{top:50%;margin-top:-24px}.garrow.l{left:12px}.garrow.r{right:12px}
.gfull{right:12px;bottom:40px}
.gdots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:4px}
.gdots button{width:22px;height:22px;border:0;padding:0;background:transparent;cursor:pointer;position:relative}
.gdots button::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#ffffff80}
.gdots button[aria-current=true]::after{background:#fff}
.ginfo{padding-top:4px}
.gcount{margin:0;font:600 13px/1.2 Cinzel,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.gtitle{margin:8px 0 18px;font:400 clamp(30px,3.6vw,44px)/1.05 Coconat,Georgia,serif;color:var(--strong);text-wrap:balance}
.gthumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}

peakers: brought 20+ experts from GAVI, CDC, WHO and big pharma onto a two-month calendar to speak with 30+ students\n- Coordination: managed assignments across 15 group projects and 3 instructors for the final grade\n- Live session: hosted an interactive session on designing a vaccine policy for west Texas to curb the measles outbreak", "heading": "Teaching: Vaccine Policy Issues", "imageId": "0bd299464c3adcdb1506dcda27ca6b6f", "links": [], "subtitle": "Graduate Teaching Assistant · Johns Hopkins · Dec 2025 to Mar 2026"}, {"body": "- Team: led 14 students to plan and run four workshops\n- Reach: 400+ student participants\n- Fundraising: raised 25,000 INR for local non-profits in Karnataka, India", "heading": "Student volunteering during COVID-19", "imageId": "", "links": [], "subtitle": "Volunteering Services Organization Representative · MCODS Mangalore · 2022"}, {"body": "- ISPPD 2026: first-author poster on gaps in WHO pertussis mortality data\n- ADAI national dental conference: 1st place out of 150+ presentations\n- UiTM Malaysia Dental Conference, Kuala Lumpur: presented \"Bite Into a Sustainable Future: The PHA Bioplastic Solution\", April 2023\n- 8+ national dental research conferences in India", "heading": "Speaking and presenting", "imageId": "faef43741ee747eab11e30f73ae8dd62", "links": [], "subtitle": "Conferences and showcases"}], "subtitle": "Bringing people together, from dental school in India to Johns Hopkins", "title": "Leadership and events"}, "projects/card-enjoy-now": {"body": "Information Desk gathers healthcare news where tech meets business, so my first round of research happens in one place.\n\n## What it tracks\n- Funding and M&A\n- Papers: NEJM, JAMA, Nature Medicine and Lancet Digital Health\n- Policy: FDA and CMS moves\n- Investor takes and industry news\n- Freshness: every story shows how old it is\n\n## Why I built it\nI pull together credible sources so I can tell my 3.5K+ LinkedIn followers what's trending and relevant in healthcare. My focus is one thing: how healthcare and technology must come together with patients and clinicians at the centre.\n\n## How it works\n- It runs entirely on GitHub, for free.\n- Once an hour, a GitHub Action pulls about 30 sources, scores and de-duplicates the stories, and saves them.\n- GitHub Pages serves the dashboard, which checks for new stories every 10 minutes.", "coverId": "98ca3e187e61496040cc21b918f0c862", "gallery": [], "links": [{"label": "View on GitHub", "url": "https://github.com/hkaur51/healthnewsboard"}], "sections": [], "subtitle": "A self-updating dashboard of healthcare tech and business news", "title": "Information Desk"}, "projects/card-listen-heart": {"body": "A playbook for cold LinkedIn messages that turn into coffee chats, built over four months of messaging and reworking.\n\n## Results\n- Conversion: ~30% of cold DMs became coffee chats\n- Replies: 90% from people whose work genuinely overlapped with mine\n\n## What makes it work\nResearch comes first. I spent 10–15 minutes on each person's background, and dropped anyone whose work didn't connect to my experience or ambitions.\n\n## What's inside\n- A three-sentence formula\n- What to cut\n- Accuracy rules\n- An editing loop\n- Follow-ups\n\nIt also works as a Claude skill.", "coverId": "6311144b4dd7878cbb875a6a3036eff3", "gallery": [], "links": [{"label": "View on GitHub", "url": "https://github.com/hkaur51/ColdDMs"}], "sections": [], "subtitle": "A reusable skill for outreach messages that get replies", "title": "Cold DM playbook"}, "projects/card-nothing-changes": {"body": "My 40 LinkedIn posts from the past year (November 2025 to November 2026) were seen 219,706 times. These are the eight that travelled furthest.", "gallery": [], "items": [{"kind": "image", "label": "Read it on LinkedIn", "mediaId": "0ae84deed1695a73b89f9d1bdbfa7237", "source": "LinkedIn · 27,921 impressions", "text": "Posted 17 Nov 2026. Reached 20,467 people, 95% of them outside my network. 77 reactions, 9 comments, 27 saves and 18 new followers.", "title": "I won $10K only to shelve my health tech startup.", "url": "https://www.linkedin.com/posts/drharsimratkaur_i-won-10k-only-to-shelve-my-health-tech-share-7528563084995637248-MMIE"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "52dd7f4e1e59c7ba8e19e8b7d7404543", "source": "LinkedIn · 21,146 impressions", "text": "Posted 30 Oct 2026. Reached 14,559 people, 94% of them outside my network. 70 reactions, 17 comments, 31 saves and 43 new followers.", "title": "This should not be a hot take, but in health AI, doctors are the GTM strategy!", "url": "https://www.linkedin.com/posts/drharsimratkaur_this-should-not-be-a-hot-take-but-in-health-share-7521850763481075712-6q-g"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "882553cedf13fdb45405dc2eb60ed1f5", "source": "LinkedIn · 20,280 impressions", "text": "Posted 29 Mar 2026. Reached 14,402 people, 92% of them outside my network. 78 reactions, 9 comments, 26 saves and 34 new followers.", "title": "Every industry has a word for the thing they didn't invent!", "url": "https://www.linkedin.com/posts/drharsimratkaur_every-industry-has-a-word-for-the-thing-they-share-7443900943739346944-6ihe"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "c5cc3511e4e5db333b4928a310582429", "source": "LinkedIn · 18,926 impressions", "text": "Posted 3 Nov 2026. Reached 13,135 people, 94% of them outside my network. 38 reactions, 7 comments, 22 saves and 21 new followers.", "title": "This should not be a hot take - but patients don't want to be owned!", "url": "https://www.linkedin.com/posts/drharsimratkaur_this-should-not-be-a-hot-take-but-patients-share-7523467219855364096-hi5x"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "a89dcf6a70c1c1936a442fc721c88066", "source": "LinkedIn · 16,038 impressions", "text": "Posted 3 Mar 2026. Reached 9,516 people, 86% of them outside my network. 110 reactions, 6 comments, 6 saves and 16 new followers.", "title": "Claude failed me today!", "url": "https://www.linkedin.com/posts/drharsimratkaur_claude-failed-me-today-last-month-i-became-share-7434787223520223232-V6mk"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "a393682a11723c1073afa93d0d606c4b", "source": "LinkedIn · 12,714 impressions", "text": "Posted 22 Oct 2026. Reached 8,832 people, 91% of them outside my network. 43 reactions, 5 comments, 6 saves and 8 new followers.", "title": "This should not be a hot take - but clinicians should be the gold standard for grading health AI.", "url": "https://www.linkedin.com/posts/drharsimratkaur_this-should-not-be-a-hot-take-but-clinicians-share-7519125839897141248-qlos"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "a9fa41317a5e1e7eb32b7754b3d6b64f", "source": "LinkedIn · 11,311 impressions", "text": "Posted 25 Apr 2026. Reached 7,070 people, 80% of them outside my network. 132 reactions, 8 comments, 5 saves and 19 new followers.", "title": "Got my Hopkins regalia yesterday! Held it up and time folded in on itself.", "url": "https://www.linkedin.com/posts/drharsimratkaur_got-my-hopkins-regalia-yesterday-held-it-share-7453931363428249600-6bIR"}, {"kind": "image", "label": "Read it on LinkedIn", "mediaId": "56e9ef0bb5e2626be872c111567ebbe8", "source": "LinkedIn · 7,839 impressions", "text": "Posted 30 Sep 2026. Reached 5,334 people, 82% of them outside my network. 49 reactions, 43 comments, 10 saves and 18 new followers. (This one is a video; play it on LinkedIn.)", "title": "This should not be a hot take - but where are all the doctors in tech?", "url": "https://www.linkedin.com/posts/drharsimratkaur_this-should-not-be-a-hot-take-but-where-ugcPost-7510916106702974977-vv8S"}], "layout": "gallery", "links": [], "sections": [{"body": "As a research assistant at the Center for Global Digital Health Innovation (May to July 2025), I produced two issues of its Research Roundup newsletter and ran its social media.\n\n## This issue\nDigital Health Transformation through Private Sector Engagement looks at how governments can partner with private tech companies to strengthen primary health care, drawing on the Digital Health Exemplars study of ten countries. It covers:\n- How these partnerships are set up\n- What makes companies take part\n- How they are paid for\n- Risks to manage: data privacy, vendor lock-in and regulatory oversight", "heading": "Newsletter for Johns Hopkins CGDHI", "imageId": "", "links": [{"label": "Read the newsletter", "url": "https://publichealth.jhu.edu/center-for-global-digital-health-innovation/digital-health-transformation-through-private-sector-engagement"}], "subtitle": "Digital Health Research Roundup, Issue 22 · May 2025"}, {"body": "## Zealth-AI (YC W21) · Sep to Nov 2021\nGTM for a Y Combinator health tech SaaS platform building remote monitoring for cancer patients, focused on LinkedIn and Facebook.\n\n## Odigio Careers, India · Marketing/Operations associate, 1st hire\n- Built the Instagram page from scratch: aesthetic, colors, ideation and execution\n- Produced founder-led videos and podcasts\n- Grew followers 6x and clientele 3x through Instagram content alone, in under six months\n- Helped build product-market fit", "heading": "Marketing associate: Zealth-AI and Odigio Careers", "imageId": "c701cf02c646562064f3136708e3a8fc", "links": [{"label": "Zealth-AI", "url": "https://zealth-ai.com/"}], "subtitle": "Digital and social media marketing"}], "subtitle": "LinkedIn posts, newsletters and campaigns", "title": "Top content"}, "projects/card-one-day": {"concerts": [], "favorite": {"artist": "Tame Impala", "title": "Let It Happen", "url": "https://open.spotify.com/track/2X485T9Z5Ly0xyaghN73ed"}, "gallery": [], "layout": "music", "links": [], "sections": [], "spotify": "https://open.spotify.com/user/314hhtakbxm2lubug5kchsmuqgva", "subtitle": "Concerts and artists I've seen live", "title": "Live music"}, "projects/card-sun-will-rise": {"body": "I did this work as my practicum at Johns Hopkins Bloomberg School of Public Health's International Vaccine Access Center (IVAC).\n\n## How I got here\nI met Dr. Maria Knoll, Director of Epidemiology at IVAC, at a seminar where she presented her work with the PCV vaccine in Nepal. After a lot of pestering and follow-ups, I started working with her as a research assistant in 2024. I abstracted scientific information on the PCV vaccine in Covidence for a meta-analysis behind the WHO's immunization schedule recommendations.\n\n## This project\n- Collaboration: Severity of Pertussis in Early Infancy was my second project with her.\n- My role: the quantitative data analysis for this Gates Foundation-funded project estimating pertussis-related deaths globally.", "coverId": "913648983ce47a26998ee6e074c0ba28", "gallery": [], "links": [{"label": "View on GitHub", "url": "https://github.com/hkaur51/Pertussis"}], "sections": [{"body": "My second contribution to this study was evaluating critical gaps in WHO pertussis mortality data in 23 countries, that earned me a first-author poster acceptance at ISPPD’26.", "heading": "Pertussis deaths in vital registration data", "imageId": "5603c763567b53ef9ba8eb0ba942b514", "links": [{"label": "Open the poster (PDF)", "url": "https://hkaur51.github.io/portfolio-hk/media/8580e96c26b2e31187995bc3e4940363.pdf"}], "subtitle": "ISPPD 2026 poster · with Shuangfei Xu, Anurima Baidya, Zeaan Pithawala, Brian Wahl and Maria Deloria Knoll"}], "subtitle": "Symptom severity and age of first infection, for a pertussis force-of-infection model", "title": "Pertussis in early infancy"}, "projects/card-sunrise": {"body": "", "coverId": "", "gallery": [], "layout": "story", "links": [], "sections": [{"body": "## Product and Growth\nI ground Ariadne's product-market fit in patient evidence. I benchmark Komodo Health, IQVIA and Semalytix, and adapt and build onto their user interface for our product. I turn research into product decisions, build our CEO's founder brand on LinkedIn, and represent Ariadne at NYC health tech events.\n\n## Fundraising\nI run Ariadne's fundraising engine. I build and refine our 10-slide deck around one claim: we know why patients stop their medication. I position the opportunity as a $788M medication non-adherence market, with opioids as our beachhead. I manage a pipeline of 45+ investors, accelerators and grants, lead applications for fundraising, and maintain a reusable answer bank for every new program.\n\n## Operations\nI run the operating system for our three-person founding team. I keep one tracker that holds every task, owner and deadline, 65+ pharma contacts and 120+ files. I turn every team call into dated, owned action items and follow through with the team till completion. Our CEO calls it \"easily the most valuable document we have.\"", "heading": "Ariadne Health AI", "imageId": "9f320d1f5a5dab695a31e5e2fd009ea5", "links": [{"label": "Visit Ariadne", "url": "https://app.ariadnehealth.ai/"}, {"label": "View the pitch deck", "url": "https://app.ariadnehealth.ai/static/pitch-deck.pdf"}], "subtitle": "First hire · Leading growth and operations · Pre-seed, current"}, {"body": "I built an AI screening tool that finds disease in photos of the mouth, as a step toward autonomous dentistry, and wrote my MSPH thesis on it.\n\n- Spark Accelerator: 1st place at the Johns Hopkins showcase\n- Fuel Accelerator: top 8 of 80+ startups\n- Summer incubator and NSF I-Corps: customer discovery with dental offices\n- Funding: about $10K non-dilutive, over six months of building and pivoting", "heading": "DYSA.AI", "imageId": "10627bd339121f1814a6640606fbf269", "links": [{"label": "Try the DYSA screening tool", "url": "https://dysa-find-a-dentist-web.vercel.app/diagnose"}], "subtitle": "Founder and product lead"}], "subtitle": "First hire at a pre-seed health AI startup, and founder of my own", "title": "Working at startups"}, "projects/card-tree-quote": {"body": "", "cta": {"heading": "Try the screening", "label": "Try it now", "text": "Upload a photo of the inside of your mouth and the model I trained screens it for tooth decay.", "url": "https://dysa-find-a-dentist-web.vercel.app/diagnose"}, "embed": "manifesto/index.html", "links": [{"label": "View on GitHub", "url": "https://github.com/hkaur51/dental-ai-benchmark-dataset"}], "subtitle": "A dental AI benchmark dataset, from my MSPH capstone", "title": "Screening Without Walls"}};

    catch (e) { setStatus(e && e.code === 'quota_exceeded' ? 'Storage is full' : 'Could not save, try again'); }

/* rich text for reading: blank-line paragraphs, "- " bullet lists, "1. " numbered lists, "## " subheads,

const FIG = /(\$\s?\d[\d,.]*\s?[KMBkmb]?\+?|\b\d[\d,.]*\s?(?:%|x\b|[KMBk]\+|[KMB]\b|\+)|\b\d+\s+in\s+\d+\b)/g;

}

}
function paragraphs(text) {

  const out = []; let list = null, kind = '';
  const close = () => { if (list) { out.push(list); list = null; kind = ''; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    let m;
    if ((m = /^[-•*–]\s*(.+)$/.exec(l))) { if (kind !== 'ul') { close(); list = h('ul', { class: 'rl' }); kind = 'ul'; } list.append(h('li', null, ...labelled(m[1]))); continue; }
    if ((m = /^\d+[.)]\s+(.+)$/.exec(l))) { if (kind !== 'ol') { close(); list = h('ol', { class: 'rl' }); kind = 'ol'; } list.append(h('li', null, ...labelled(m[1]))); continue; }

    if ((m = /^#{2,3}\s*(.+)$/.exec(l))) { out.push(h('h3', { class: 'rh' }, m[1])); continue; }
    out.push(h('p', null, ...inl(l)));
  }
  close();
  return out;
}

function embedFrame(src, title) {
  const NATURAL = 900;
  const box = h('div', { class: 'embed' });

  box.append(fr);

  const fit = () => {
    try { const d = fr.contentDocument; if (d && d.documentElement) H = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0) || H; } catch (e) {}
    const k = Math.min(1, box.clientWidth / NATURAL);

        h('button', { class: 'btn danger', type: 'button', onclick: () => { p.sections.splice(i, 1); save(); drawSecs(); } }, 'Delete section')));
  }));
  drawSecs();
  const lay = h('select', null, h('option', { value: 'story' }, 'Story page (text, cover, sections)'), h('option', { value: 'gallery' }, 'Gallery (swipe through many pieces)'), h('option', { value: 'music' }, 'Music (record player and concert list)'));
  lay.value = ['gallery', 'music'].includes(p.layout) ? p.layout : 'story';
  lay.onchange = () => { p.layout = lay.value; save(); renderProject(id); };
  if (p.layout === 'music') {
    put(sheet,
      h('h1', { class: 'ptitle' }, 'Editing the music page'),
      h('p', { class: 'hint' }, 'Changes save as you type. Press Done to see it the way visitors will.'),
      field('Page style', lay), field('Title', ti), field('Line under the title', su),
      musicEditor(p, save));
    projects[id] = p;
    return;
  }
  if (p.layout === 'gallery') {
    put(sheet,
      h('h1', { class: 'ptitle' }, 'Editing this gallery'),
      h('p', { class: 'hint' }, 'Changes save as you type. Press Done to see it the way visitors will.'),
      field('Page style', lay), field('Title', ti), field('Subtitle', su), field('Intro (optional)', bo),
      galleryEditor(p, save, id),
      h('div', { class: 'field' }, h('span', null, 'Sections below the gallery'), secBox,
        h('button', { class: 'btn', type: 'button', onclick: () => { p.sections.push({ heading: '', subtitle: '', body: '', imageId: '', links: [] }); save(); drawSecs(); } }, 'Add section')));
    projects[id] = p;
    return;
  }
  put(sheet, 
    h('h1', { class: 'ptitle' }, 'Editing this page'),
    field('Page style', lay),
    h('p', { class: 'hint' }, 'Changes save as you type. Press Done to see it the way visitors will.'),
    p.coverId ? h('img', { class: 'cover', src: blob(p.coverId), alt: '', style: 'margin-top:18px' }) : null,
    field('Cover image', cov),
    p.coverId ? h('button', { class: 'btn', type: 'button', onclick: () => { p.coverId = ''; save(); renderProject(id); } }, 'Remove cover') : null,
    field('Title', ti), field('Subtitle', su), field('Story', bo),
    h('div', { class: 'field' }, h('span', null, 'Links'), linkBox,
      h('button', { class: 'btn', type: 'button', onclick: () => { p.links.push({ label: '', url: '' }); save(); drawLinks(); } }, 'Add link')),
    field('Add gallery images', gal),
    p.gallery.length ? h('div', { class: 'gallery' }, p.gallery.map((g, i) => h('figure', null, h('img', { src: blob(g), alt: '' }),
      h('button', { class: 'btn rm', type: 'button', onclick: () => { p.gallery.splice(i, 1); save(); renderProject(id); } }, 'remove')))) : null,
    h('div', { class: 'field' }, h('span', null, 'More work on this project'), secBox,
      h('button', { class: 'btn', type: 'button', onclick: () => { p.sections.push({ heading: '', subtitle: '', body: '', imageId: '', links: [] }); save(); drawSecs(); } }, 'Add section'))
  );
  projects[id] = p;
}
function watchProject(id) {
  if (currentProject === id) return;
  if (projUnsub) { projUnsub(); projUnsub = null; }
  currentProject = id;
  if (!db) return;
  projUnsub = db.doc('projects/' + id).onSnapshot(s => {
    if (s.exists && !(pageEditing && canEdit)) { projects[id] = clone(s.data()); renderProject(id); }
    else if (s.exists && !projects[id]) { projects[id] = clone(s.data()); renderProject(id); }
  }, () => {});
}

/* ---- about ---- */
function igUrl(v) {
  v = txt(v).trim(); if (!v) return '';
  if (okUrl(v)) return v;
  const h = v.replace(/^@/, '').replace(/[^A-Za-z0-9._]/g, '');
  return h ? 'https://www.instagram.com/' + h + '/' : '';
}
function renderSocial() {
  const items = [];
  const li = okUrl(about.linkedin) ? about.linkedin.trim() : '';
  const ig = igUrl(about.instagram);
  const em = txt(about.email).trim();
  const ext = href => ({ href, target: '_blank', rel: 'noopener' });
  if (li) items.push(h('a', ext(li), 'LinkedIn ↗'));
  else if (canEdit) items.push(h('a', { href: '#about', class: 'todo', onclick: () => { pageEditing = true; } }, 'LinkedIn ↗'));
  if (ig) items.push(h('a', ext(ig), 'Instagram ↗'));
  else if (canEdit) items.push(h('a', { href: '#about', class: 'todo', onclick: () => { pageEditing = true; } }, 'Instagram ↗'));
  if (em) items.push(h('a', { href: 'mailto:' + em, class: 'mail' }, em));
  else if (canEdit) items.push(h('a', { href: '#about', class: 'todo', onclick: () => { pageEditing = true; } }, 'Email ↗'));
  put($('#social'), items);
  requestAnimationFrame(markOnPhoto);
}
function markOnPhoto() {
  const st = $('#stage').getBoundingClientRect();
  const edge = wideMQ.matches ? 0.72 : 0.99;   // where the portrait starts
  for (const a of document.querySelectorAll('#social a')) {
    const r = a.getBoundingClientRect();
    a.classList.toggle('onphoto', r.left - st.left > st.width * edge);
  }
}
window.addEventListener('resize', markOnPhoto);
function renderHeader() {
  renderSocial();
  $('#hName').textContent = txt(about.name) || 'Your name';
  $('#hTag').textContent = txt(about.tagline);
}
function renderAbout() {
  const sheet = $('#aboutSheet');
  if (!(canEdit && pageEditing)) {
    const contact = [];
    if (txt(about.email)) contact.push(h('div', null, 'Email: ', h('a', { href: 'mailto:' + about.email.trim() }, about.email.trim())));
    if (okUrl(about.linkedin)) contact.push(h('div', null, h('a', { href: about.linkedin.trim(), target: '_blank', rel: 'noopener' }, 'LinkedIn')));
    if (igUrl(about.instagram)) contact.push(h('div', null, h('a', { href: igUrl(about.instagram), target: '_blank', rel: 'noopener' }, 'Instagram')));
    put(sheet, h('header', { class: 'hero' }, h('div', null,
        h('h1', { class: 'ptitle' }, txt(about.name) || 'About'),
        about.tagline ? h('p', { class: 'psub' }, about.tagline) : null)),
      h('div', { class: 'aboutgrid' },
      h('div', { class: 'ph' }, about.photoId ? h('img', { src: blob(about.photoId), alt: txt(about.name) || 'Portrait' }) : h('div', { 'aria-hidden': 'true' })),
      h('div', null,
        about.bio ? h('div', { class: 'pbody' }, paragraphs(about.bio)) : h('p', { class: 'empty' }, 'Still being pinned up.'),
        contact.length ? h('div', { class: 'contact' }, contact) : null)));
    document.title = 'About · Portfolio';
    return;
  }
  const save = () => { renderHeader(); saveAbout(); };
  const mk = (key, type, ph) => { const i = h('input', { type, value: txt(about[key]), placeholder: ph }); i.oninput = () => { about[key] = i.value; save(); }; return i; };
  const bio = h('textarea', { placeholder: 'Who you are and what you are working toward.' }); bio.value = txt(about.bio); bio.oninput = () => { about.bio = bio.value; save(); };
  const ph = h('input', { type: 'file', accept: 'image/*' });
  ph.onchange = async () => { const f = ph.files[0]; if (!f) return; const r = await upload(f); if (r) { about.photoId = r; save(); renderAbout(); } };
  put(sheet, 
    h('h1', { class: 'ptitle' }, 'Editing your about page'),
    about.photoId ? h('img', { class: 'cover', src: blob(about.photoId), alt: '', style: 'max-width:220px;aspect-ratio:4/5;margin-top:18px' }) : null,
    field('Photo', ph), field('Name', mk('name', 'text', 'Your name')),
    field('One-line intro (also shows in the header)', mk('tagline', 'text', 'What you do, in a line')),
    field('Bio', bio), field('Email', mk('email', 'email', 'you@example.com')),
    field('LinkedIn (https://…)', mk('linkedin', 'url', 'https://www.linkedin.com/in/…')),
    field('Instagram (@handle or https://…)', mk('instagram', 'text', '@yourhandle')));
}

/* ---- routing ---- */
function route() {
  const hsh = location.hash.slice(1);
  const isProj = hsh.startsWith('project-'), isAbout = hsh === 'about';
  $('#vBoard').hidden = isProj || isAbout; $('#vProject').hidden = !isProj; $('#vAbout').hidden = !isAbout;
  $('#navBoard').toggleAttribute('aria-current', !isProj && !isAbout); if (!isProj && !isAbout) $('#navBoard').setAttribute('aria-current', 'page');
  $('#navAbout').toggleAttribute('aria-current', isAbout); if (isAbout) $('#navAbout').setAttribute('aria-current', 'page');
  if (isProj || isAbout) { if (editing) { editing = false; document.body.classList.remove('editing'); $('#panel').hidden = true; } }
  else { pageEditing = false; document.title = 'Dr. Harsimrat Kaur, MSPH, BDS'; }
  const COMBOS = ['red', 'blue', 'blue'];
  if (isProj) { const i = boxes.findIndex(x => x.id === hsh.slice(8)); document.body.dataset.combo = COMBOS[(i < 0 ? 0 : i) % 3]; }
  else if (isAbout) document.body.dataset.combo = 'blue';
  else delete document.body.dataset.combo;
  if (isProj) { const id = hsh.slice(8); watchProject(id); renderProject(id); window.scrollTo(0, 0); }
  if (isAbout) { renderAbout(); window.scrollTo(0, 0); }
  syncTools();
}
window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#project-') && location.hash !== '#about') pageEditing = false; route(); });

renderBoard(); renderHeader(); route();

(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [d, a, u] = await Promise.all([use('db'), use('assets'), use('user')]);
  db = d; assets = a;
  try { canEdit = !!(u && await u.canEdit()); } catch { canEdit = false; }
  syncTools(); renderSocial();
  if (!db) { if (canEdit) note('Saving is not available in this view, so changes will not be kept.'); return; }
  const timer = setTimeout(() => note('The latest version of this board could not be loaded yet.'), 10000);
  db.doc('site/board-thread').onSnapshot(s => {
    if (!s.metadata.fromCache) { clearTimeout(timer); note(''); }
    if (s.exists && Array.isArray(s.data().boxes) && !drag && Date.now() > holdBoardUntil) {
      boxes = clone(s.data().boxes); renderBoard(); if (selectedId) select(selectedId);
    }
  }, () => { clearTimeout(timer); });
  if (location.hash.startsWith('#project-')) { currentProject = null; watchProject(location.hash.slice(9)); }
  /* owner-only helper: shrink very large images to web size (used when copying the site to GitHub Pages) */
  if (location.hash === '#export-shrink' && canEdit && assets) {
    const ids = ['c9689aa68d8c63e407d171565614442b', '10627bd339121f1814a6640606fbf269', '95f02c3530bf16b3337e9bd3de29f234', '98c7f5e5736faace01585a28475db399', '913648983ce47a26998ee6e074c0ba28'];
    const map = {};
    for (const id of ids) {
      try {
        setStatus('Shrinking ' + id.slice(0, 6) + '…');
        const bmp = await createImageBitmap(await (await fetch(blob(id))).blob());
        const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
        cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        const out = await new Promise(r => cv.toBlob(r, 'image/webp', 0.86));
        const r = await assets.upload(new File([out], id + '.webp', { type: 'image/webp' }));
        map[id] = r.id;
      } catch (e) { map[id] = 'error: ' + (e && e.message); }
    }
    try { await db.doc('site/export').set({ map, at: new Date().toISOString() }); setStatus('Export images ready'); } catch (e) { setStatus('Could not save export map'); }
  }
  db.doc('site/about').onSnapshot(s => {
    if (s.exists && !(pageEditing && location.hash === '#about')) { about = clone(s.data()); renderHeader(); if (location.hash === '#about') renderAbout(); }
  }, () => {});
})();
}
</script>
